<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Destinos desatendidos · Aeropuerto de Alicante-Elche</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14203a;--mut:#5b6785;--bd:#d8deea;--sea:#fff;--land:#3568b4;--red:#d93631;--blue:#1f4e9c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#18213a;--tx:#e8edf8;--mut:#9aa7c5;--bd:#2a3556;--sea:#0f1626;--land:#3d6fc0}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#18213a;--tx:#e8edf8;--mut:#9aa7c5;--bd:#2a3556;--sea:#0f1626;--land:#3d6fc0}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--red);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:1.25rem;line-height:1.2}
header span{opacity:.9;font-size:.85rem}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px;max-width:1300px;margin:0 auto}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
#mapwrap{position:relative;overflow:hidden;padding:0}
svg{display:block;width:100%;height:auto;max-height:82vh;background:var(--sea);cursor:grab;touch-action:none;user-select:none}
svg.drag{cursor:grabbing}
.land{fill:var(--land);stroke:var(--sea);stroke-width:.6}
.pin{fill:var(--red);stroke:#fff;cursor:pointer}
.pin.sel{fill:#ffb703}
.lbl rect{fill:var(--red)}
.lbl text{fill:#fff;font-weight:700;font-family:system-ui,sans-serif;pointer-events:none}
.route{fill:none;stroke:var(--red);opacity:.55}
.route.sel{stroke:#ffb703;opacity:1}
.hub{fill:var(--blue);stroke:#fff}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;font-size:18px}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}
button.pri{background:var(--red);color:#fff;border-color:var(--red)}
side,aside{display:flex;flex-direction:column;gap:12px}
h2{font-size:.95rem;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 100px;min-width:0}
label.chk{display:flex;gap:6px;align-items:center;flex:0 0 auto;font-size:.88rem;color:var(--mut)}
#list{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:4px;margin-top:8px}
#list button{text-align:left;display:flex;justify-content:space-between;gap:8px;padding:6px 10px}
#list button.sel{border-color:var(--red);background:rgba(217,54,49,.12)}
#list small,.mut{color:var(--mut)}
textarea{width:100%;min-height:110px;font:12px/1.4 ui-monospace,Menlo,monospace}
#info b{font-size:1.05rem}
</style>
</head>
<body>
<header>
  <h1>Destinos desatendidos<br>Aeropuerto de Alicante-Elche</h1>
  <span>Mapa interactivo de rutas · arrastra, haz zoom y pulsa en un destino</span>
</header>
<main>
  <div class="card" id="mapwrap">
    <svg id="map" viewBox="0 0 400 620" aria-label="Mapa de destinos"></svg>
    <div class="zoom"><button id="zi" title="Acercar">+</button><button id="zo" title="Alejar">−</button><button id="zr" title="Restablecer">⟲</button></div>
  </div>
  <aside>
    <div class="card">
      <h2>Destinos (<span id="count">0</span>)</h2>
      <div class="row"><input id="q" placeholder="Buscar destino…"><select id="cf"></select></div>
      <div class="row" style="margin-top:8px">
        <label class="chk"><input type="checkbox" id="tl" checked> Etiquetas</label>
        <label class="chk"><input type="checkbox" id="tr" checked> Rutas desde ALC</label>
      </div>
      <div id="list"></div>
    </div>
    <div class="card" id="info"><span class="mut">Selecciona un destino para ver su ficha.</span></div>
    <div class="card">
      <h2>Añadir destino</h2>
      <div class="row"><input id="an" placeholder="Nombre"><input id="ac" placeholder="País"></div>
      <div class="row" style="margin-top:8px"><input id="al" placeholder="Latitud" inputmode="decimal"><input id="ao" placeholder="Longitud" inputmode="decimal"></div>
      <input id="ano" placeholder="Nota (aerolínea, frecuencia…)" style="width:100%;margin-top:8px">
      <label class="chk" style="margin-top:8px"><input type="checkbox" id="pick"> Fijar coordenadas pulsando en el mapa</label>
      <button class="pri" id="add" style="width:100%;margin-top:8px">Añadir al mapa</button>
      <div class="mut" id="msg" style="margin-top:6px;font-size:.85rem"></div>
    </div>
    <div class="card">
      <h2>Datos (JSON)</h2>
      <textarea id="json" spellcheck="false"></textarea>
      <div class="row" style="margin-top:8px"><button id="apply">Aplicar JSON</button><button id="reset">Restaurar lista inicial</button></div>
      <div class="mut" style="font-size:.82rem;margin-top:6px">Los cambios se guardan en este navegador. Copia el JSON para conservarlos o compartirlos.</div>
    </div>
  </aside>
</main>
<script>
const W=400,H=620,KX=8.64,KY=13.5,ALC={n:"Alicante-Elche",lo:-0.56,la:38.28};
const P=(lo,la)=>[(lo+16)*KX,(72-la)*KY];
const DEF=[["Tromsø","Noruega",69.68,18.92],["Harstad-Narvik/Evenes","Noruega",68.49,16.68],["Bodø","Noruega",67.27,14.36],["Oulu","Finlandia",64.93,25.35],["Umeå","Suecia",63.79,20.28],["Molde","Noruega",62.74,7.27],["Tampere","Finlandia",61.41,23.6],["Karlstad","Suecia",59.44,13.34],["Malmö","Suecia",55.54,13.37],["Londonderry","Reino Unido",55.04,-7.16],["Belfast City","Reino Unido",54.62,-5.87],["Humberside","Reino Unido",53.57,-0.35],["Doncaster","Reino Unido",53.47,-1.0],["Londres Heathrow","Reino Unido",51.47,-0.45],["Lübeck","Alemania",53.8,10.72],["Dortmund","Alemania",51.52,7.61],["Leipzig","Alemania",51.42,12.24],["Maastricht","Países Bajos",50.91,5.77],["Lieja","Bélgica",50.64,5.44],["Brno","Chequia",49.15,16.69],["Berna","Suiza",46.91,7.5],["Klagenfurt","Austria",46.65,14.34],["Pisa","Italia",43.68,10.39],["Niza","Francia",43.66,7.21],["Vigo","España",42.23,-8.63],["Valladolid","España",41.71,-4.85],["Zaragoza","España",41.67,-1.04],["Tlemcen","Argelia",35.02,-1.45],["Nador","Marruecos",34.99,-3.03],["Agadir","Marruecos",30.32,-9.41],["Fuerteventura","España",28.45,-13.86]].map(a=>({n:a[0],c:a[1],la:a[2],lo:a[3],note:""}));
const LAND=[
[[-9.5,37],[-8.8,38.7],[-9.4,39.5],[-8.8,41.5],[-9.3,43],[-8,43.7],[-5,43.5],[-1.8,43.4],[-1.2,44.7],[-1.2,46.2],[-2.5,47.3],[-4.7,48],[-3,48.8],[-1.5,48.7],[-1.3,49.7],[0.2,49.5],[1.6,50.5],[3.2,51.3],[4.5,52.5],[5,53.3],[8.5,53.7],[8.7,54.8],[8.2,56.5],[10.6,57.7],[10.5,56],[10.9,54.2],[14,54],[18.5,54.8],[21,55.2],[21,57],[24,57.3],[24.4,59.4],[28,59.5],[30,60],[30,46],[28.5,43.5],[27.5,41.5],[26,40.5],[23,40.5],[24,38],[22.8,36.5],[21.5,37],[21,38.5],[19.5,41.5],[18.5,42.5],[15.5,45],[13.7,45.5],[12.3,45.3],[12.4,44],[14,42.5],[16,41.8],[18.5,40.2],[17,39],[16.5,38],[15.7,38],[16,40],[15,40.2],[13,41.3],[10.5,43],[9,44.3],[7.5,43.8],[6,43.1],[3.2,43.2],[3.1,42.4],[0.8,41],[-0.3,39.5],[0,38.7],[-0.7,37.6],[-2.2,36.7],[-4.5,36.6],[-5.6,36],[-6.3,36.8],[-7.4,37.2]],
[[5,58.5],[5,61],[7,63],[10,64],[13,67],[16,69],[20,70],[25,71],[30,70.5],[30,67],[29.5,64],[30,61],[28,60.5],[23,60],[21.5,61],[21.5,63.5],[25,65],[24,65.8],[21,64.5],[17.5,62.5],[17.5,60.5],[19,59.8],[16.5,57.5],[16,56.2],[14,55.4],[12.8,55.6],[12.5,56.5],[11.5,58],[10.5,59.5],[8,58.1]],
[[-5.5,50],[-3,50.7],[1.4,51.2],[1.7,52.7],[0,53.5],[-1.5,55],[-2,56],[-3,57.7],[-5,58.6],[-6.2,57.5],[-5.5,55.5],[-3,54.9],[-3.2,53.4],[-4.5,53.3],[-4.2,52.2],[-5.2,51.7],[-3,51.3],[-4.5,50.4]],
[[-10,51.7],[-6,52.2],[-6,54],[-5.8,54.7],[-7.3,55.3],[-8.5,54.5],[-10,53.8],[-9.5,52.2]],
[[8.2,41],[9.7,41],[9.6,39.2],[8.4,39]],[[12.5,38],[15.6,38.2],[15,36.7]],[[2.4,39.6],[3.4,39.8],[3.1,39.3]],
[[-14.5,28.7],[-13.9,28.8],[-13.8,28.1],[-14.4,28]],
[[-13,27],[-13,28],[-10,29],[-9.8,30],[-9.7,31],[-8.7,33.3],[-6.8,34],[-5.5,35.8],[-2.9,35.4],[-1,35.1],[1,36.5],[5,36.8],[8,37],[10,37.2],[11,35],[10.2,33.8],[11.5,33],[14,32.5],[16,31],[20,31],[30,31],[30,27]],
[[26,40.7],[29,41.1],[34,42],[38,41],[40,41],[40,36.5],[36,36.5],[30,36.5],[27,37],[26.5,39]]
];
const $=id=>document.getElementById(id),svg=$("map");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=DEF.map(x=>({...x})),sel=-1,view={x:0,y:0,w:W,h:H},drag=null;
try{const s=localStorage.getItem("alc-dest");if(s){const a=JSON.parse(s);if(Array.isArray(a)&&a.length)D=a}}catch(e){}
function save(){try{localStorage.setItem("alc-dest",JSON.stringify(D))}catch(e){}}
const z=()=>W/view.w;
function vis(d){const q=$("q").value.trim().toLowerCase(),c=$("cf").value;return(!q||d.n.toLowerCase().includes(q))&&(!c||d.c===c)}
function render(){
  const k=z(),h=P(ALC.lo,ALC.la);let s="";
  LAND.forEach(poly=>{s+=`<path class="land" d="M${poly.map(p=>P(p[0],p[1]).map(v=>v.toFixed(1)).join(",")).join("L")}Z"/>`});
  const tr=$("tr").checked,tl=$("tl").checked;let routes="",pins="",lbls="";
  D.forEach((d,i)=>{
    if(!vis(d))return;
    const p=P(d.lo,d.la),on=i===sel;
    if(tr||on){const mx=(h[0]+p[0])/2,my=(h[1]+p[1])/2,dx=p[0]-h[0],dy=p[1]-h[1],L=Math.hypot(dx,dy);
      routes+=`<path class="route${on?" sel":""}" stroke-width="${(on?2:1)/k}" d="M${h[0]},${h[1]}Q${mx-dy*.18},${my+dx*.18} ${p[0]},${p[1]}"/>`}
    pins+=`<circle class="pin${on?" sel":""}" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="${(on?6:4.5)/k}" stroke-width="${1/k}"/>`;
    if(tl||on){const f=9/k,w=d.n.length*f*.58+6/k;
      lbls+=`<g class="lbl"><rect x="${p[0]-w/2}" y="${p[1]-f*2.1}" width="${w}" height="${f*1.35}"/><text x="${p[0]}" y="${p[1]-f*1.1}" font-size="${f}" text-anchor="middle">${esc(d.n)}</text></g>`}
  });
  s+=routes+pins+lbls+`<circle class="hub" cx="${h[0]}" cy="${h[1]}" r="${7/k}" stroke-width="${1.5/k}"/><text x="${h[0]+9/k}" y="${h[1]+4/k}" font-size="${10/k}" font-weight="700" fill="#fff" stroke="#1f4e9c" stroke-width="${3/k}" paint-order="stroke">ALC</text>`;
  svg.innerHTML=s;svg.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`);
}
function lists(){
  const cs=[...new Set(D.map(d=>d.c))].sort(),cur=$("cf").value;
  $("cf").innerHTML='<option value="">Todos los países</option>'+cs.map(c=>`<option${c===cur?" selected":""}>${esc(c)}</option>`).join("");
  const v=D.map((d,i)=>[d,i]).filter(x=>vis(x[0])).sort((a,b)=>a[0].n.localeCompare(b[0].n));
  $("count").textContent=v.length;
  $("list").innerHTML=v.map(x=>`<button data-i="${x[1]}" class="${x[1]===sel?"sel":""}"><span>${esc(x[0].n)}</span><small>${esc(x[0].c)}</small></button>`).join("");
  $("json").value=JSON.stringify(D,null,1);
  const d=D[sel];
  $("info").innerHTML=d?`<b>${esc(d.n)}</b><div class="mut">${esc(d.c)} · ${d.la.toFixed(2)}, ${d.lo.toFixed(2)}</div><div>Distancia desde ALC: <b>${km(d)} km</b></div>${d.note?`<p>${esc(d.note)}</p>`:""}<button id="del" style="margin-top:8px">Eliminar destino</button>`:'<span class="mut">Selecciona un destino para ver su ficha.</span>';
}
function km(d){const r=Math.PI/180,a=ALC.la*r,b=d.la*r,dl=(d.lo-ALC.lo)*r;return Math.round(6371*Math.acos(Math.min(1,Math.sin(a)*Math.sin(b)+Math.cos(a)*Math.cos(b)*Math.cos(dl))))}
function all(){lists();render()}
function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function zoomAt(f,c){const w=Math.min(W,Math.max(30,view.w/f)),h=w*H/W;
  c=c||{x:view.x+view.w/2,y:view.y+view.h/2};
  view={x:c.x-(c.x-view.x)*w/view.w,y:c.y-(c.y-view.y)*h/view.h,w,h};render()}
function select(i,focus){sel=i;if(focus&&i>=0){const p=P(D[i].lo,D[i].la),w=Math.min(view.w,150);view={x:p[0]-w/2,y:p[1]-w*H/W/2,w,h:w*H/W}}all()}
svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY<0?1.25:.8,pt(e))},{passive:false});
svg.addEventListener("pointerdown",e=>{svg.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,m:false,t:e.target}});
svg.addEventListener("pointermove",e=>{if(!drag)return;const s=svg.getScreenCTM().a,dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.hypot(dx,dy)>4){drag.m=true;svg.classList.add("drag")}
  if(drag.m){view.x=drag.vx-dx/s;view.y=drag.vy-dy/s;svg.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`)}});
svg.addEventListener("pointerup",e=>{const d=drag;drag=null;svg.classList.remove("drag");if(!d||d.m)return;
  const i=d.t.dataset&&d.t.dataset.i;
  if(i!==undefined){select(+i,false)}
  else if($("pick").checked){const p=pt(e);$("ao").value=(p.x/KX-16).toFixed(2);$("al").value=(72-p.y/KY).toFixed(2)}});
$("zi").onclick=()=>zoomAt(1.5);$("zo").onclick=()=>zoomAt(1/1.5);
$("zr").onclick=()=>{view={x:0,y:0,w:W,h:H};render()};
$("list").onclick=e=>{const b=e.target.closest("button");if(b)select(+b.dataset.i,true)};
$("info").onclick=e=>{if(e.target.id==="del"&&sel>=0&&confirm("¿Eliminar "+D[sel].n+"?")){D.splice(sel,1);sel=-1;save();all()}};
["q","cf","tl","tr"].forEach(id=>$(id).addEventListener("input",all));
$("add").onclick=()=>{
  const n=$("an").value.trim(),c=$("ac").value.trim()||"—",la=parseFloat($("al").value.replace(",",".")),lo=parseFloat($("ao").value.replace(",","."));
  if(!n||isNaN(la)||isNaN(lo)||Math.abs(la)>90||Math.abs(lo)>180){$("msg").textContent="Indica nombre y coordenadas válidas.";return}
  D.push({n,c,la,lo,note:$("ano").value.trim()});["an","ac","al","ao","ano"].forEach(id=>$(id).value="");
  $("msg").textContent="Destino añadido.";save();select(D.length-1,true)};
$("apply").onclick=()=>{try{const a=JSON.parse($("json").value);
  if(!Array.isArray(a)||a.some(d=>typeof d.n!=="string"||isNaN(d.la)||isNaN(d.lo)))throw 0;
  D=a.map(d=>({n:d.n,c:d.c||"—",la:+d.la,lo:+d.lo,note:d.note||""}));sel=-1;save();all()}catch(e){alert("JSON no válido: cada destino necesita n, la y lo.")}};
$("reset").onclick=()=>{if(confirm("¿Restaurar la lista inicial?")){D=DEF.map(x=>({...x}));sel=-1;save();all()}};
all();
</script>
</body>
</html>
